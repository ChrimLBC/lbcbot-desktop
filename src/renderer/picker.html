<!doctype html>
<meta charset="utf-8">
<title>Share your screen</title>
<link rel="stylesheet" href="renderer.css">
<style>
    /* A chooser, not a pane: the app's card styling would add chrome nobody needs in a one-decision window. */
    /*
     * renderer.css locks `body` to `height: 100vh; overflow: hidden` — right for the app shell, where only the
     * active pane scrolls, and wrong here: inherited unchanged, every source past the window's 540px was clipped
     * with nothing to scroll, so a screen listed below a few windows could not be chosen at all. So the body is
     * a column, the heading stays pinned, and the GRID is the scroll region.
     */
    body { margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
           font: 13px -apple-system, system-ui, sans-serif; }
    h1 { flex: 0 0 auto; font-size: 14px; margin: 0; padding: 14px 14px 10px; }
    /* min-height: 0 is load-bearing — a flex child defaults to its content height and would never scroll. */
    .grid { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 14px 14px; align-content: start;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .src { border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 8px; cursor: pointer;
           background: rgba(255,255,255,.04); text-align: left; color: inherit; font: inherit; }
    .src:hover { border-color: #9147ff; }
    .src img { width: 100%; border-radius: 4px; display: block; background: #000; }
    .src span { display: block; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
<body>
    <h1>Choose what to share</h1>
    <div class="grid" id="grid"></div>
    <script>
        (async () => {
            const sources = await window.picker.sources();
            const grid = document.getElementById('grid');
            sources.forEach((s) => {
                const b = document.createElement('button');
                b.className = 'src';
                b.innerHTML = '<img alt=""><span></span>';
                b.querySelector('img').src = s.thumb;
                b.querySelector('span').textContent = s.name;
                b.addEventListener('click', () => window.picker.choose(s.id));
                grid.appendChild(b);
            });
            if (!sources.length) grid.textContent = 'Nothing available to share.';
        })();
    </script>
</body>
