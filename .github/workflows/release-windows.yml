name: Release (Windows)

# Tag-driven, not push-driven. A desktop release is a thing people download and keep, so it should be an
# explicit act with a version attached — not a side effect of every commit to main. Also runnable by hand
# from the Actions tab to produce an unpublished build for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    # Must be a real Windows runner. electron-builder can cross-build NSIS from macOS/Linux only via Wine,
    # which is a fragile extra dependency for no benefit when GitHub hands us Windows for free.
    runs-on: windows-latest
    permissions:
      # Needed to create the release and upload the installer to it.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` against the committed lockfile, so a release is built from exactly the dependency tree that
      # was reviewed rather than whatever resolves on the day.
      - run: npm ci

      # The tag IS the version.
      #
      # electron-builder stamps the app from package.json, and the updater compares that stamp against the
      # version in the published latest.yml. Tagging v1.0.1 without bumping package.json therefore ships an app
      # that still calls itself 1.0.0: it compares 1.0.0 to 1.0.0, decides it is current, and the release reaches
      # nobody. That is exactly what v1.0.1 was. Writing the tag's version in here makes the two impossible to
      # drift — the committed package.json version stops being load-bearing.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # No code signing. An unsigned installer makes Windows SmartScreen warn ("Windows protected your PC" →
      # More info → Run anyway) but still installs, which is an acceptable trade while this is pre-beta.
      # Signing needs a purchased OV/EV certificate; when there is one, add CSC_LINK / CSC_KEY_PASSWORD
      # secrets and electron-builder picks them up with no change here.
      #
      # `--publish never` still WRITES dist/latest.yml (the publish config in package.json is what makes it
      # generate); it just does not upload it. The release step below does that, so the upload stays one
      # explicit, tag-gated action.
      - name: Build installer
        run: npx electron-builder --win --publish never

      # Always available, tag or not — this is what makes workflow_dispatch useful for testing a build before
      # committing to a version number.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LBCBot-Setup-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

      # Only on a tag. The website's download button points at this release's asset, so publishing is what
      # makes a version live for users.
      #
      # latest.yml and the .blockmap are NOT optional extras. latest.yml is the only thing an installed copy
      # reads to discover that a new version exists — publish just the .exe and every existing install stays
      # frozen while the release page looks perfectly complete. The .blockmap is what lets the updater download
      # only the changed chunks instead of the whole installer.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: true
